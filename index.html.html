sheet(`<h2>Confirm submission</h2><p>Only confirm if you filed it on the employer's site and saw a confirmation.</p><input id="cf" placeholder="Confirmation number or note (optional)"><div class="row"><button class="btn" onclick="conf('${id}')">I submitted it myself</button><button class="btn g" onclick="openJob('${id}')">Not yet</button></div>`);return}j.stage=v;save();openJob(id)}
function conf(id){const j=J(id);j.stage="Submitted";j.sub={d:td(),c:$("#cf").value.trim()};save();openJob(id)}
function openCon(id){const c=C(id);sheet(`<div class="row sp"><h2 style="margin:0">${esc(c.n)}</h2>${X}</div><p class="mu">${LAD[c.st]}${c.ev?" · "+esc(c.ev):""}</p>${c.lg.slice(-5).reverse().map(l=>`<div class="mu">${l.d}: ${esc(l.m)}</div>`).join("")}
${c.nx&&c.nx<=td()?`<div class="card" style="border-color:var(--wn)"><b>Decision needed</b><div class="row" style="margin-top:6px"><button class="btn sm" onclick="applyInd('${id}')">Apply independently</button><button class="btn sm g" onclick="oneMore('${id}')">One last follow-up</button></div></div>`:""}<h2>Log contact</h2><textarea id="lm" placeholder="What happened? (Message sent, call, no reply...)"></textarea><label class="mu">Next follow-up date</label><input type="date" id="ln" value="${c.nx||add(5)}"><button class="btn" onclick="logC('${id}')">Save log</button>
${c.st<6?`<h2>Advance to: ${LAD[c.st+1]}</h2><textarea id="ae" placeholder="Evidence required: what did they actually say or do?"></textarea><button class="btn g" onclick="advC('${id}')">Advance with evidence</button>`:""}<div class="row" style="margin-top:10px">${c.st>0?`<button class="btn sm g" onclick="C('${id}').st--;save();openCon('${id}')">Step back</button>`:""}</div>`)}
function applyInd(id){const c=C(id);c.lg.push({d:td(),m:"Decided to apply independently."});c.nx="";save();toast("Logged. Go find the posting.");go("find")}
function oneMore(id){const c=C(id),d=add(4);c.nx=d;c.lg.push({d:td(),m:"Sending one last follow-up. Deadline "+d});save();toast("Deadline set to "+d);openCon(id)}
function logC(id){const c=C(id),m=$("#lm").value.trim();if(!m){toast("Write what happened");return}c.lg.push({d:td(),m});c.nx=$("#ln").value;save();openCon(id)}
function advC(id){const c=C(id),e=$("#ae").value.trim();if(!e){toast("Evidence is required");return}c.st++;c.ev=e;c.lg.push({d:td(),m:"Stage: "+LAD[c.st]+". "+e});save();openCon(id)}
const T={c1:"Hey Contact A, no rush. Just wanted to see how it went with your boss on Monday. Whenever you get a minute, a text is fine.",c2:"Hey Contact B, thanks for the rundown on the junior advisor role. I'm starting on the SIE now so I'm ready whenever the timing opens up. Is there anything you'd want me to have done before then?",c3:"Hi, it's [your name] from down the street. I'm finishing a finance degree and trying to get into financial services. Would you have 15 minutes sometime to share how you'd approach it if you were starting out?",c4:"Hi, I'm a [your school] finance grad ([your fraternity]) looking at banking and wealth management roles. Do you have 10 minutes to share how you got started and what you'd do differently? Thanks either way."};
function draft(id){const c=C(id);sheet(`<div class="row sp"><h2 style="margin:0">Draft to ${esc(c.n)}</h2>${X}</div><p class="mu">Edit it so it sounds like you. This app does not send messages.</p><textarea id="dt" style="min-height:150px">${esc((T[id]||"").replace(/Contact A|Contact B/g,c.n))}</textarea><div class="row"><button class="btn" onclick="cp()">Copy</button><button class="btn g" onclick="openCon('${id}')">Log it as sent</button></div>`)}
function cp(){const t=$("#dt");try{navigator.clipboard.writeText(t.value).then(()=>toast("Copied"),()=>{t.select();toast("Select and copy")})}catch(e){t.select();toast("Select and copy")}}
function bk(){const s=JSON.stringify(S);try{navigator.clipboard.writeText(s).then(()=>toast("Backup copied"),()=>toast("Copy failed"))}catch(e){toast("Copy failed")}}
function rest(){try{const o=JSON.parse($("#rs").value);if(!o.jobs||!o.con)throw 0;S=Object.assign(D(),o);save();ren();toast("Restored")}catch(e){toast("That isn't a valid backup")}}
function openProfile(){const s=S.set;sheet(`<div class="row sp"><h2 style="margin:0">Settings</h2>${X}</div><div class="card"><label class="mu">Minimum base pay, no commission ($, 0 = none)</label><input type="number" inputmode="numeric" value="${s.fb}" onchange="S.set.fb=+this.value||0;save()"><label class="mu">Minimum base with commission ($, 0 = none)</label><input type="number" inputmode="numeric" value="${s.fc}" onchange="S.set.fc=+this.value||0;save()"><label class="mu">Max one-way commute (min)</label><input type="number" inputmode="numeric" value="${s.mc}" onchange="S.set.mc=+this.value||0;save()"><label class="k"><input type="checkbox" ${s.ft?"checked":""} onchange="S.set.ft=this.checked;save()"> Full-time roles only</label><label class="mu">Applications per day goal</label><input type="number" inputmode="numeric" value="${s.dgoal}" onchange="S.set.dgoal=+this.value||0;save()"><label class="k"><input type="checkbox" ${s.reloc?"checked":""} onchange="S.set.reloc=this.checked;save()"> Open to relocating for a strong role</label></div>
<div class="card"><b>Privacy</b><ul class="mu"><li>Data stays in this browser. No server or account.</li><li>Don't enter legal, background or GPA details here.</li><li>The app never sends, applies or contacts anyone.</li></ul></div><button class="btn g" onclick="if(confirm('Erase everything in this app?')){S=D();save();closeSheet()}">Reset all data</button>`)}
ren();
</script></body></html>
